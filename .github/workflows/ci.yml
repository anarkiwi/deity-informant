name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VAGRANT_MOSES_ROMCACHE: ${{ github.workspace }}/.romcache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends clang-format
          pip install -e ".[dev]"
      # The coverage gate measures the native lifter and the machine-driven code, so the
      # extension is built into the source tree beside the editable install.
      - name: Build native extension
        run: |
          maturin build --release --locked -i python -o wheels
          unzip -j wheels/*.whl 'deity_informant/_native*' -d deity_informant
          python -c "import deity_informant as d; assert d.NATIVE"
      - name: C64 ROM cache key
        id: roms
        run: >-
          python -c "from vagrant_moses.roms import ASSETS, ROMS;
          print('key=c64-roms-' + '-'.join(r.sha256 for r in {**ROMS, **ASSETS}.values()))"
          >> "$GITHUB_OUTPUT"
      - name: C64 ROM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VAGRANT_MOSES_ROMCACHE }}
          key: ${{ steps.roms.outputs.key }}
      - name: Fetch and verify C64 ROMs
        run: python -c "from vagrant_moses.roms import ASSETS, ROMS, fetch_rom; [fetch_rom(n) for n in {**ROMS, **ASSETS}]"
      - name: Format
        run: black --check deity_informant/ tests/ tools/
      - name: Lint
        run: pylint deity_informant/
      - name: Build 6510 SLEIGH module (pypcode-bundled compiler)
        run: deity-informant emit-sleigh
      - name: Test
        run: pytest tests/ -n auto --cov=deity_informant --cov-fail-under=85

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cargo test links the abi3 cdylib's test harness against libpython.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Bench smoke
        run: cargo run --release --locked -p di-pcode --example bench -- sort 1000000

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      VAGRANT_MOSES_ROMCACHE: ${{ github.workspace }}/.romcache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install vagrant-moses
        run: pip install "vagrant-moses>=0.13.0"
      - name: C64 ROM cache key
        id: roms
        run: >-
          python -c "from vagrant_moses.roms import ASSETS, ROMS;
          print('key=c64-roms-' + '-'.join(r.sha256 for r in {**ROMS, **ASSETS}.values()))"
          >> "$GITHUB_OUTPUT"
      - name: C64 ROM cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VAGRANT_MOSES_ROMCACHE }}
          key: ${{ steps.roms.outputs.key }}
      - name: Fetch and verify C64 ROMs
        run: python -c "from vagrant_moses.roms import ASSETS, ROMS, fetch_rom; [fetch_rom(n) for n in {**ROMS, **ASSETS}]"
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/native.Dockerfile
          build-args: PYTHON_VERSION=${{ matrix.python }}
          tags: di-native:${{ matrix.python }}
          load: true
          cache-from: type=gha,scope=native-${{ matrix.python }}
          cache-to: type=gha,scope=native-${{ matrix.python }},mode=max
      # The ROMs are copied into the container, never into an image layer or the build cache.
      - name: Test
        run: |
          docker create --name di-native -e C64_ROMS=/roms di-native:${{ matrix.python }}
          docker cp "$VAGRANT_MOSES_ROMCACHE" di-native:/roms
          docker start -a di-native

  sdist:
    runs-on: ubuntu-latest
    container: python:3.12-slim-trixie
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist
      - name: Install without a Rust toolchain
        run: |
          if command -v cargo; then exit 1; fi
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.tar.gz pytest numpy
      # Tests run from a copy without the in-tree package so imports resolve to the install.
      - name: Test pure-Python install
        run: |
          mkdir /tmp/sd && cp -r tests /tmp/sd/
          cd /tmp/sd
          /tmp/venv/bin/python -c "import deity_informant as d; assert not d.NATIVE"
          /tmp/venv/bin/pytest -q tests/test_vm.py tests/test_lifter.py tests/test_native.py

  ghidra-integration:
    # The illegal LAX/ISC decode under the actual Ghidra headless analyzer (not
    # just libsla/pypcode), ghidra/6510/headless/run.sh. Ghidra + JDK live in a
    # multistage image (Dockerfile.ghidra); the Ghidra layer is GHA-cached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Ghidra integration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ghidra
          tags: di-ghidra:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Ghidra headless integration test
        run: docker run --rm di-ghidra:ci

  vtools-integration:
    # SIDId, sidreloc and GoatTracker 2's gt2reloc (docker/vtools.Dockerfile, one cached stage per
    # tool) against each other on GoatTracker ground truth, tests/test_vtools_docker.py.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v4
      - name: Build validation tools image
        uses: docker/build-push-action@v7
        with:
          context: docker/vtools
          file: docker/vtools.Dockerfile
          tags: di-vtools
          load: true
          cache-from: type=gha,scope=vtools
          cache-to: type=gha,scope=vtools,mode=max
      - name: Install
        run: pip install -e . pytest
      - name: Test
        run: pytest -q tests/test_vtools.py tests/test_vtools_docker.py
