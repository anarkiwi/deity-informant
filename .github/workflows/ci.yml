name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Format
        run: black --check deity_informant/ tests/
      - name: Lint
        run: pylint deity_informant/
      - name: Build 6510 SLEIGH module (pypcode-bundled compiler)
        run: deity-informant emit-sleigh
      - name: Test
        run: pytest tests/ -n auto --cov=deity_informant --cov-fail-under=85

  ghidra-integration:
    # The illegal LAX/ISC decode under the actual Ghidra headless analyzer (not
    # just libsla/pypcode), ghidra/6510/headless/run.sh; the facts-driven export
    # and emulator oracles live in anarkiwi/trackerprog. Ghidra + JDK live in a
    # multistage image (Dockerfile.ghidra); the Ghidra layer is GHA-cached.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Ghidra integration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ghidra
          tags: di-ghidra:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Ghidra headless integration test
        run: docker run --rm di-ghidra:ci
