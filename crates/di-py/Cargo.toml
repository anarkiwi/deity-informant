[package]
name = "di-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
di-pcode = { path = "../di-pcode" }
di-lift = { path = "../di-lift" }
indicatif = "0.18"
pyo3 = { version = "0.30", features = ["abi3-py310"] }
