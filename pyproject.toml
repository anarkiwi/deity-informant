[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deity-informant"
version = "0.6.2"
description = "NMOS 6510 illegal-opcode toolkit: a standalone 6510 -> raw-P-Code lifter + pure-Python P-Code VM, and a 6510 Ghidra/pypcode SLEIGH processor module."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Josh Bailey", email = "josh@overlyspecific.com" }]
keywords = ["6502", "6510", "ghidra", "sleigh", "pcode", "illegal-opcodes", "decompiler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: System :: Emulators",
]
dependencies = ["jennings>=0.9.0", "numpy", "networkx", "tqdm"]

[project.optional-dependencies]
ghidra = ["pypcode"]
dev = ["pytest", "pytest-xdist", "pytest-cov", "build", "black", "pylint", "py65", "pypcode", "maturin", "pebble", "vagrant-moses[cpu]>=0.8.0"]

[project.urls]
Homepage = "https://github.com/anarkiwi/deity-informant"
Repository = "https://github.com/anarkiwi/deity-informant"

[project.scripts]
deity-informant = "deity_informant.cli:main"

[tool.setuptools.packages.find]
include = ["deity_informant*"]

[tool.setuptools.package-data]
"deity_informant.sleigh" = ["languages/*"]

# Wheels carry the native IR as `deity_informant._native`: `maturin build --release` (CI) or
# `maturin develop`. The sdist builds with setuptools above and installs pure Python only.
[tool.maturin]
manifest-path = "crates/di-py/Cargo.toml"
module-name = "deity_informant._native"
python-source = "."
python-packages = ["deity_informant"]
features = ["pyo3/extension-module"]

[tool.coverage.run]
source = ["deity_informant"]

[tool.black]
line-length = 100

[tool.pylint.main]
jobs = 0
extension-pkg-allow-list = ["deity_informant._native"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["A", "X", "Y", "S", "SP", "C", "e", "vm", "op", "mn", "md", "t", "v", "r", "pc", "L"]

[tool.pylint."messages control"]
# missing-docstring off: short helpers (C/e/nz) and tests carry no docstrings.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-return-statements",
    "invalid-name",
    "consider-using-f-string",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-lines",
    "too-many-public-methods",
    "consider-using-in",
    "consider-using-max-builtin",
    "protected-access",
    "unused-argument",
    "exec-used",
    "duplicate-code",
]
