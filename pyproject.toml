[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "deity-informant"
version = "0.41.3"
description = "NMOS 6510 illegal-opcode toolkit: a standalone 6510 -> raw-P-Code lifter + pure-Python P-Code VM, and a 6510 Ghidra/pypcode SLEIGH processor module."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Josh Bailey", email = "josh@overlyspecific.com" }]
keywords = ["6502", "6510", "ghidra", "sleigh", "pcode", "illegal-opcodes", "decompiler"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: System :: Emulators",
]
dependencies = ["jennings>=0.26.1", "numpy", "networkx", "tqdm", "dd==0.6.0", "wayward-eagle>=0.5.10"]

[project.optional-dependencies]
ghidra = ["pypcode"]
dev = ["pytest", "pytest-xdist", "pytest-cov", "pytest-timeout", "build", "black", "pylint", "py65", "pypcode", "maturin", "pebble", "vagrant-moses[cpu]>=0.20.0", "pysidtracker>=0.65.0", "pylibresidfp>=0.6.1", "zstandard", "pyelftools", "pysayme>=0.2.0"]

[project.urls]
Homepage = "https://github.com/anarkiwi/deity-informant"
Repository = "https://github.com/anarkiwi/deity-informant"

[project.scripts]
deity-informant = "deity_informant.cli:main"

[tool.setuptools.packages.find]
include = ["deity_informant*"]

[tool.setuptools.package-data]
"deity_informant.sleigh" = ["languages/*"]

# Wheels carry the native IR as `deity_informant._native`: `maturin build --release` (CI) or
# `maturin develop`. The sdist builds with setuptools above and installs pure Python only.
[tool.maturin]
manifest-path = "crates/di-py/Cargo.toml"
module-name = "deity_informant._native"
python-source = "."
python-packages = ["deity_informant"]
features = ["pyo3/extension-module"]

# Per-test guards (docs/testing.md): a runaway lift fails with its stacks within `timeout`
# seconds; tests/conftest.py caps each worker's heap.
[tool.pytest.ini_options]
timeout = 30
timeout_method = "thread"

[tool.coverage.run]
source = ["deity_informant"]

[tool.black]
line-length = 100

[tool.pylint.main]
jobs = 0
extension-pkg-allow-list = ["deity_informant._native", "dd.cudd"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["A", "X", "Y", "S", "SP", "C", "e", "vm", "op", "mn", "md", "t", "v", "r", "pc", "L"]

[tool.pylint."messages control"]
# missing-docstring off: short helpers (C/e/nz) and tests carry no docstrings.
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-return-statements",
    "invalid-name",
    "consider-using-f-string",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-lines",
    "too-many-public-methods",
    "consider-using-in",
    "consider-using-max-builtin",
    "protected-access",
    "unused-argument",
    "exec-used",
    "duplicate-code",
]

# Code here must not duplicate code its dependencies already export (pysayme). A key in
# `allow` is a deliberate duplicate; its value says why.
[tool.pysayme]
roots = ["deity_informant", "tests", "tools"]
ignore-dists = ["pytest", "pytest-xdist", "pytest-cov", "pytest-timeout", "build", "black", "pylint", "maturin", "pysayme"]

[tool.pysayme.allow]
"deity_informant/c64devices.py:SID -> pysidtracker.playspec.outorder:SID" = "the C64 register map; pysidtracker is a downstream dev extra"
"deity_informant/c64devices.py:TEST -> vagrant_moses.sidorder:TEST" = "the SID control bits; vagrant-moses is a downstream dev extra"
"deity_informant/c64devices.py:SAW -> vagrant_moses.sidorder:SAW" = "the SID control bits; vagrant-moses is a downstream dev extra"
"deity_informant/vm.py:vector.resolve -> vagrant_moses:read_vector" = "the VM core runs without vagrant-moses, a downstream dev extra"
"tools/cgenplay.py:psid -> pysidtracker:load_psid" = "needs the start song and the unplaced body, which load_psid does not return"
"deity_informant/lifter.py:_adc_decimal -> deity_informant/lifter.py:_sbc_decimal" = "different NMOS BCD algorithms: ADC adds nibbles with a >9 adjust and derives carry/N/V from the intermediate; SBC subtracts with two borrow masks and returns only the accumulator"
"deity_informant/lifter.py:_adc -> deity_informant/lifter.py:_sbc" = "different p-code: ADC's carry is the OR of two INT_CARRYs and overflow uses ~(A^v); SBC's carry is a 16-bit compare and overflow uses (A^v); ADC also takes carry and N/V from the decimal path"
"deity_informant/vm.py:_run_out -> deity_informant/vm.py:run_irq_driven" = "run_irq_driven's step loop takes nested interrupts between instructions while I is clear; delegating to _run_out would lose that or add a per-instruction callback on the hot path"
"deity_informant/strided.py:meet -> deity_informant/cgen/printer.py:Func.iv" = "Func.iv is the per-op interval transfer function; its (lo & top, hi & top) if lo <= hi is a wrap-around check, not an intersection, and it already calls printer.meet where it intersects"
"deity_informant/hello_world.py:_run_vm -> tools/cgenplay.py:main" = "only the 64K image placement idiom is shared: _run_vm runs the hello-world program in PcodeVM, cgenplay.main translates a program with cgen, compiles and replays it"
"deity_informant/lifter.py:C -> tools/pcodeopt.py:C" = "lifter varnodes are mutable lists with a default size; pcodeopt expressions are hashable tuples used as dict/set keys"
"tools/pcode2c.py:Fn.var -> tools/pcodeopt.py:vname" = "registers already share slot_name; temporaries differ: pcode2c names them as function-local C identifiers, pcodeopt suffixes @PC so they are unique program-wide"
"tools/pcodeopt.py:candidate_cells.walk -> tools/pcodeopt.py:evars" = "different visitors over the same expression-tree recursion: walk reports each load's address to visit(), evars collects variable names; a generic walker would slow evars on the optimizer's hot path"
"tools/wpcorpus.py:_scan_table -> deity_informant/c64.py:trace_table" = "different native tables: Tracer's encodes the stored register, push count and any writer, excluding RMW from plain stores; Scan's marks only CPU stores"
"tests/test_cgen.py:trap_meta -> tests/test_wholeprog.py:exact" = "trap_meta translates to C and checks trap_info keys and kinds; exact lifts and replays calls against the reference interpreter; only the assemble/act/check shape is shared"
"tests/test_guard_proofs.py:test_a_store_the_first_call_does_not_make_deopts -> tests/test_wholeprog.py:test_soft_deopt_resumes_with_folded_register" = "two-line uses of the shared exact() replay helper over different programs: stores the first call's facts never saw vs CODEHIT's code guard resuming with a folded register"
"tests/test_status_fuzz.py:test_random_status_programs_are_exact -> tests/test_carry_fuzz.py:test_random_carry_programs_are_exact" = "different generators and per-call state: status_fuzz replays each call from its status byte's flags, carry_fuzz lifts a data-patched image, checks fused chains and replays each call with its own memory words and decimal flag"
"tests/test_cgen.py:test_init_probe_of_a_derived_register_is_a_run_time_choice -> tests/test_cgen.py:test_timer_flag_wait_and_acknowledges_are_kept" = "different device models: a derived SID register's init fallback replayed against two values vs a CIA timer-flag machine model with its acknowledge reads replayed as sensitive"
"tests/test_cgen.py:test_operand_patched_from_constants_is_a_known_store -> tests/test_cgen.py:test_table_inside_code_a_store_writes_is_data" = "different programs and claims: an operand patched from constants gives a direct store with no wr(), a table inside code written by a store becomes region elements whose indexed expressions are pinned"
"tests/test_cgen.py:test_known_opcodes_are_cells_without_code_checks -> tests/test_cgen.py:test_indexed_stores_clear_operand_cells" = "different stats and claims: opcode cells of restored or indexed opcode stores vs operand cells of a clearing loop, whose field array and indexed zero stores are pinned"
